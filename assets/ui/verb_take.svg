<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24">
  <!-- Prendi: palmo aperto cartoon, dita lunghe e affusolate, pollice
       divaricato in basso a destra.
       Ogni dito e' una capsula: un segmento con le estremita' tonde, cosi'
       base e punta si scrivono come due punti invece di dedurle da un
       rettangolo ruotato.
       Tutto e' disegnato due volte: prima con il tratto allargato e scuro,
       che fonde le parti in una sagoma sola, poi in pelle sopra. Senza questo
       passaggio le dita restano incollate al palmo e la mano non si legge. -->
  <g fill="#2b2135" stroke="#2b2135" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.2 16.2L4.8 7.9" stroke-width="4.1"/>
    <path d="M9.6 17.0L9.0 6.0" stroke-width="4.2"/>
    <path d="M13.2 17.0L14.2 6.6" stroke-width="4.2"/>
    <path d="M16.2 16.6L19.0 9.0" stroke-width="4.0"/>
    <path d="M13.4 19.9L18.0 17.7" stroke-width="4.6"/>
    <ellipse cx="10.6" cy="16.4" rx="5.0" ry="4.3" transform="rotate(-8 10.6 16.4)" stroke-width="1.6"/>
  </g>
  <g fill="#f4b183" stroke="#f4b183" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.2 16.2L4.8 7.9" stroke-width="2.5"/>
    <path d="M9.6 17.0L9.0 6.0" stroke-width="2.6"/>
    <path d="M13.2 17.0L14.2 6.6" stroke-width="2.6"/>
    <path d="M16.2 16.6L19.0 9.0" stroke-width="2.4"/>
    <path d="M13.4 19.9L18.0 17.7" stroke-width="3.0"/>
    <ellipse cx="10.6" cy="16.4" rx="5.0" ry="4.3" transform="rotate(-8 10.6 16.4)" stroke="none"/>
  </g>
  <!-- cuscinetti e pieghe del palmo -->
  <ellipse cx="8.4" cy="17.6" rx="2.1" ry="2.9" transform="rotate(-14 8.4 17.6)" fill="#f8c39c"/>
  <g fill="none" stroke="#dd9264" stroke-width="0.5" stroke-linecap="round">
    <path d="M6.8 14.6c2.5 1.3 5.1 1.8 7.5 1.5"/>
    <path d="M4.49 11.20L6.17 10.91"/><path d="M8.35 10.23L10.11 10.13"/><path d="M12.94 10.47L14.70 10.64"/><path d="M17.17 11.61L18.70 12.17"/>
  </g>
  <g stroke="#fbcda5" stroke-linecap="round" fill="none">
    <path d="M4.64 9.98L4.45 8.81" stroke-width="0.43"/><path d="M8.62 8.67L8.54 7.13" stroke-width="0.44"/><path d="M13.44 9.05L13.58 7.59" stroke-width="0.44"/><path d="M17.88 10.66L18.27 9.59" stroke-width="0.41"/><path d="M16.64 17.69L17.28 17.38" stroke-width="0.51"/>
  </g>
</svg>
