<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24">
  <!-- Prendi: palmo aperto cartoon, dita a ventaglio e pollice divaricato.
       Le parti sono disegnate due volte: prima come silhouette scura allargata
       dal proprio contorno, che le fonde in una sagoma sola, poi in pelle
       sopra. Senza questo passaggio le dita restano rettangoli incollati al
       palmo e la mano non si legge. Le dita nascono attaccate e si aprono
       verso la punta, come in una mano vera: e' quello che scava le valli. -->
  <g fill="#2b2135" stroke="#2b2135" stroke-width="1.6" stroke-linejoin="round">
    <rect x="10.40" y="4.60" width="2.2" height="10.20" rx="1.1" transform="rotate(-34 11.5 19.8)"/>
    <rect x="10.40" y="3.60" width="2.2" height="11.20" rx="1.1" transform="rotate(-11 11.5 19.8)"/>
    <rect x="10.40" y="4.20" width="2.2" height="10.60" rx="1.1" transform="rotate(12 11.5 19.8)"/>
    <rect x="10.40" y="6.20" width="2.2" height="8.60" rx="1.1" transform="rotate(35 11.5 19.8)"/>
    <rect x="10.00" y="9.90" width="3.0" height="7.40" rx="1.5" transform="rotate(68 11.5 19.8)"/>
    <ellipse cx="11.4" cy="15.4" rx="5.7" ry="4.7"/>
    <rect x="8.7" y="18.4" width="5.4" height="3.6" rx="1.4"/>
  </g>
  <g fill="#f4b183">
    <rect x="10.40" y="4.60" width="2.2" height="10.20" rx="1.1" transform="rotate(-34 11.5 19.8)"/>
    <rect x="10.40" y="3.60" width="2.2" height="11.20" rx="1.1" transform="rotate(-11 11.5 19.8)"/>
    <rect x="10.40" y="4.20" width="2.2" height="10.60" rx="1.1" transform="rotate(12 11.5 19.8)"/>
    <rect x="10.40" y="6.20" width="2.2" height="8.60" rx="1.1" transform="rotate(35 11.5 19.8)"/>
    <rect x="10.00" y="9.90" width="3.0" height="7.40" rx="1.5" transform="rotate(68 11.5 19.8)"/>
    <ellipse cx="11.4" cy="15.4" rx="5.7" ry="4.7"/>
    <rect x="8.7" y="18.4" width="5.4" height="3.6" rx="1.4"/>
  </g>
  <ellipse cx="11.2" cy="16" rx="4.2" ry="3.2" fill="#f8c39c"/>
  <path d="M8.9 15.2c1.8.8 3.6 1.1 5.4.9" fill="none" stroke="#e5a276" stroke-width="0.55" stroke-linecap="round"/>
