      <rect x="10.3" y="1.4" width="3.4" height="5" rx="1" transform="rotate(90 12 12)"/>
      <rect x="10.3" y="1.4" width="3.4" height="5" rx="1" transform="rotate(135 12 12)"/>
      <rect x="10.3" y="1.4" width="3.4" height="5" rx="1" transform="rotate(180 12 12)"/>
      <rect x="10.3" y="1.4" width="3.4" height="5" rx="1" transform="rotate(225 12 12)"/>
      <rect x="10.3" y="1.4" width="3.4" height="5" rx="1" transform="rotate(270 12 12)"/>
      <rect x="10.3" y="1.4" width="3.4" height="5" rx="1" transform="rotate(315 12 12)"/>
    </g>
    <circle cx="12" cy="12" r="7" fill="#f2903c"/>
