<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24">
  <!-- Usa: ingranaggio cartoon. Denti sotto, corpo piu chiaro sopra di essi
       (cosi le radici dei denti non si vedono), mozzo scuro, luce in alto. -->
  <g stroke="#2b2135" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round">
    <g fill="#e07f2c">
      <rect x="10.3" y="1.4" width="3.4" height="5" rx="1"/>
